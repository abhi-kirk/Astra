name: CI

# Quality gate for a push. The morning run, the sleeve, and the weekly jobs do not
# run these checks: a library release or a type-checker nit must not skip a trade.
# A red check here means main is dirty. It does not stop the next scheduled run.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run --frozen ruff check

      - name: Type check (pyright)
        run: uv run --frozen pyright

      - name: Run tests
        run: uv run --frozen pytest
