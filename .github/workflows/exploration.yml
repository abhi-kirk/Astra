name: Weekly Exploration

on:
  schedule:
    - cron: "0 1 * * 6"   # Saturday 1am UTC = Friday 9pm ET (after market close)
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  explore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run exploration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TAVILY_MCP_URL: ${{ secrets.TAVILY_MCP_URL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Unused by this run — passed so the "effective" settings snapshot it stamps
          # reports the same Autotrader switch the Autotrader itself resolves. See
          # tests/test_settings.py::test_settings_writing_workflows_share_the_env_layer.
          AGENT_TRADING_ENABLED: ${{ secrets.AGENT_TRADING_ENABLED }}
        run: uv run --frozen python -m src.exploration

      # Output goes to Supabase exploration_candidates table only — no files committed.
