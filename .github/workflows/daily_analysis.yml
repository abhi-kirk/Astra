name: Daily Analysis

on:
  # Daily trigger is Supabase pg_cron → net.http_post → workflow_dispatch (migration 006),
  # which fires on time (GitHub's own scheduler drifted 2–3.5 hrs). Also allows manual runs.
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check

      - name: Type check (pyright)
        run: pyright

      - name: Run tests
        run: pytest

      - name: Decode Robinhood tokens
        env:
          ROBINHOOD_TOKENS_ENC: ${{ secrets.ROBINHOOD_TOKENS_ENC }}
        run: |
          if [ -n "$ROBINHOOD_TOKENS_ENC" ]; then
            echo "$ROBINHOOD_TOKENS_ENC" | base64 -d > tokens.enc
          fi

      - name: Run ASTRA analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TAVILY_MCP_URL: ${{ secrets.TAVILY_MCP_URL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ROBINHOOD_TOKEN_KEY: ${{ secrets.ROBINHOOD_TOKEN_KEY }}
          ROBINHOOD_ACCOUNT_NUMBER: ${{ secrets.ROBINHOOD_ACCOUNT_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Unused by this run (it never places an order), but every run that calls
          # settings.load_and_apply() stamps the shared "effective" snapshot the dashboard
          # reads. Without the secret this run would resolve the switch to its code default
          # (off) and the UI would report the Autotrader as OFF while it is live.
          AGENT_TRADING_ENABLED: ${{ secrets.AGENT_TRADING_ENABLED }}
        run: python -m src.agent --mode simulation

      # A failed run never starts the Autotrader (that workflow only chains off success),
      # and a skipped sleeve looks like a quiet day. Text before the log is the only signal.
      - name: Text if this run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram is not configured. The failure stays in the Actions log."
            exit 1
          fi
          text="ASTRA morning run failed, so the sleeve did not trade. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Do not pass --show-error: curl would print the request URL, which contains the bot token.
          if ! curl --fail-with-body --silent --output /tmp/tg.json \
              --request POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"; then
            echo "Telegram alert failed."
            cat /tmp/tg.json
            exit 1
          fi

      # Analysis output goes to Supabase only — no files committed back to repo.
