name: Autotrader Execution

# Isolated from the Advisor track so it can be paused/killed independently. Runs AFTER the daily
# analysis completes (the Advisor track persists the paper track that Autotrader mirrors), and is also
# manually dispatchable. Guardrails are code-enforced; no real order is placed unless the
# AGENT_TRADING_ENABLED secret is set true (and the owner has approved the execution path).
on:
  workflow_run:
    workflows: ["Daily Analysis"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Review only — read the account and size orders, but never place"
        type: boolean
        default: false

jobs:
  execute:
    runs-on: ubuntu-latest
    # Only chain off a successful Advisor run (manual dispatch always allowed).
    # A failed Daily Analysis skips this job on purpose. That failure texts from
    # daily_analysis.yml, so the skip is not a silent day.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      # Locked runtime only. Checks run on push (ci.yml), not in front of an order.
      - name: Install dependencies
        run: uv sync --locked

      - name: Decode agentic OAuth token
        env:
          AGENT_RH_TOKENS_ENC: ${{ secrets.AGENT_RH_TOKENS_ENC }}
        run: |
          if [ -n "$AGENT_RH_TOKENS_ENC" ]; then
            echo "$AGENT_RH_TOKENS_ENC" | base64 -d > agent_tokens.enc
          fi

      - name: Execute Autotrader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Autotrader master switch + agentic account. Auth is the encrypted OAuth store
          # (agent_tokens.enc, decoded above) + its key — the MCP SDK refreshes it headlessly.
          AGENT_TRADING_ENABLED: ${{ secrets.AGENT_TRADING_ENABLED }}
          AGENT_ACCOUNT_NUMBER: ${{ secrets.AGENT_ACCOUNT_NUMBER }}
          AGENT_RH_TOKEN_KEY: ${{ secrets.AGENT_RH_TOKEN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            uv run --frozen python -m src.agent_executor --dry-run
          else
            uv run --frozen python -m src.agent_executor
          fi
